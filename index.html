<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10160f">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Aktapokus Word Safari</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="pwa/icon-192.png">
<link rel="apple-touch-icon" href="pwa/icon-192.png">
<!-- iOS Safari, manifest.webmanifest'teki display:fullscreen'i kendi
     baslina uygulamiyor - "Ana Ekrana Ekle" sonrasi tam ekran/app-gibi
     davranmasi icin Apple'a ozel meta etiketleri sart. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aktapokus">
<style>
  html,body{margin:0;height:100%;background:#10160f;overscroll-behavior:none}
  .ke-shell.ke-fs{position:fixed;inset:0;height:100dvh;width:100vw;z-index:1}
  noscript{color:#fff;font:16px sans-serif;padding:24px;display:block}
</style>
</head>
<body>
<div id="app"></div>
<noscript>This app needs JavaScript.</noscript>
<script type="module" src="app.js"></script>
</body>
</html>
